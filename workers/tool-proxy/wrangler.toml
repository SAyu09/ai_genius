name = "ai-genius-tool-proxy"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PLATFORM_ORIGIN = "https://aigenius.app"

# KV Namespace for agent suspension flags
[[kv_namespaces]]
binding = "AGENT_STATUS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# KV Namespace for rate limiting counters
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

# Analytics Engine for performance logging
[[analytics_engine_datasets]]
binding = "PERF_ANALYTICS"

# Environment-specific overrides
[env.production]
routes = [{ pattern = "agent-proxy.aigenius.workers.dev/*", zone_name = "aigenius.app" }]

[env.staging]
routes = [{ pattern = "agent-proxy-staging.aigenius.workers.dev/*", zone_name = "aigenius.app" }]
