name = "ai-genius-tool-proxy"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PLATFORM_ORIGIN = "https://aigenius.app"
ALLOWED_ORIGINS = "https://aigenius.app,https://www.aigenius.app"

# KV Namespace for agent status + suspension cache
[[kv_namespaces]]
binding = "AGENT_STATUS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Analytics Engine for performance logging
[[analytics_engine_datasets]]
binding = "PERF_ANALYTICS"

# Environment-specific overrides
[env.production]
routes = [{ pattern = "tools.aigenius.app/*", zone_name = "aigenius.app" }]

[env.staging]
routes = [{ pattern = "tools-staging.aigenius.app/*", zone_name = "aigenius.app" }]
